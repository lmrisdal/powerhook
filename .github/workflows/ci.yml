name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test and vet (Linux + Windows)
        run: make test
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Check install script syntax
        run: bash -n packaging/install.sh
      - name: Build (linux amd64/arm64, windows amd64)
        run: make
