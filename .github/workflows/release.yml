name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: make test

      # Asset names must match internal/update and packaging/install.{sh,ps1}.
      - name: Build binaries
        run: |
          make VERSION="${GITHUB_REF_NAME}"
          cd dist && sha256sum powerhook-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/powerhook-linux-amd64 \
            dist/powerhook-linux-arm64 \
            dist/powerhook-windows-amd64.exe \
            dist/SHA256SUMS.txt
